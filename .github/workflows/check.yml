name: Check starter

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and start containers
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
      - name: Check PHP syntax
        run: |
          docker compose exec -T web php -l Lab09_config.php
          docker compose exec -T web php -l Lab09_add_book.php
          docker compose exec -T web php -l index.php
      - name: Check starter behavior
        run: python3 scripts/smoke-test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down -v
